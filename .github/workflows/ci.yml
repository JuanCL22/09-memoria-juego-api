name: CI · Calidad y Seguridad

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    name: Check, Build y Auditoría
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar dependencias limpias
        run: npm ci

      - name: Ejecutar pruebas del Hook PreToolUse de IA
        run: npm run test:hook

      - name: Verificar calidad (typecheck + lint + format:check + vitest coverage)
        run: npm run check

      - name: Compilar aplicación Next.js
        run: npm run build

      - name: Auditoría de vulnerabilidades en dependencias
        run: npm audit --audit-level=high
